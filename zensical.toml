[project]
site_name = "python-devtools"
site_description = "Python's missing debug print command and other development tools."
site_url = "https://python-devtools.helpmanual.io/"

repo_url = "https://github.com/samuelcolvin/python-devtools"
repo_name = "samuelcolvin/python-devtools"

nav = [
  { "Overview" = "index.md" },
  "install.md",
  "usage.md",
  { "Changelog" = "https://github.com/samuelcolvin/python-devtools/releases" },
]

extra_css = ["theme/customization.css"]

[project.theme]
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "pink"
accent = "pink"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "pink"
accent = "pink"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github-alt"
link = "https://github.com/samuelcolvin/python-devtools"

[project.markdown_extensions]
admonition = {}
attr_list = {}
toc.permalink = "🔗"
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = ["docs"]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}

[project.plugins.exclude]
# the example scripts and the build script are inputs to the docs, not pages
glob = ["examples/*", "build.py", "__pycache__/*"]
